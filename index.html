<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cyberpunk V7</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#05070b;
    color:#e8ffff;
}

.background{

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left,
    rgba(0,255,255,.08),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(0,170,255,.08),
    transparent 35%),

    linear-gradient(
    180deg,
    #05070b,
    #08111b,
    #05070b);

    z-index:-2;

}

.background::before{

    content:"";

    position:absolute;

    inset:0;

    background-image:

    linear-gradient(
    rgba(0,255,255,.04) 1px,
    transparent 1px),

    linear-gradient(
    90deg,
    rgba(0,255,255,.04) 1px,
    transparent 1px);

    background-size:45px 45px;

    opacity:.4;

}

.screen{

    display:none;

    width:100%;
    height:100%;

    justify-content:center;
    align-items:center;

    position:absolute;

}

.card{

    width:360px;

    max-width:90%;

    padding:25px;

    background:#0d1724;

    border:1px solid #29d9ff;

    border-radius:18px;

    box-shadow:

    0 0 15px rgba(0,255,255,.10);

}

.boot-box{

    width:340px;

    text-align:center;

}

.loading{

    width:100%;

    height:8px;

    margin-top:25px;

    background:#132333;

    border-radius:10px;

    overflow:hidden;

}

#loadingBar{

    width:0%;

    height:100%;

    background:#2ee8ff;

}

button{

    width:100%;

    margin-top:15px;

    padding:13px;

    font-size:15px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    background:#143247;

    color:#bfffff;

    transition:.25s;

}

button:hover{

    background:#1d4d68;

}

#dateBox,
#timeBox{

    margin-top:15px;

    padding:12px;

    border:1px solid #29d9ff;

    border-radius:10px;

    background:#08131d;

}

.profile-box{

    margin-top:15px;

    padding:15px;

    border:1px solid #29d9ff;

    border-radius:12px;

}

.about-box{

    margin-top:15px;

    padding:15px;

    border:1px solid #29d9ff;

    border-radius:12px;

    line-height:1.8;

}

</style>

</head>

<body>

<!-- Background -->
<div class="background"></div>

<!-- Boot Screen -->
<div id="boot" class="screen">

    <div class="boot-box">

        <h1>CYBER INTERFACE</h1>

        <div class="loading">

            <div id="loadingBar"></div>

        </div>

        <p id="loadingText">
        Initializing...
        </p>

    </div>

</div>

<!-- Login -->
<div id="login" class="screen">

    <div class="card">

        <h1>TAN FALIM SAFII</h1>

        <button onclick="enterSystem()">

            ENTER SYSTEM

        </button>

    </div>

</div>

<!-- Dashboard -->
<div id="dashboard" class="screen">

    <div class="card">

        <h1>CYBER DASHBOARD</h1>

        <div id="dateBox"></div>

        <div id="timeBox"></div>

        <button onclick="openProfile()">

            MY PROFILE

        </button>

        <button onclick="exitSystem()">

            EXIT

        </button>

    </div>

</div>

<!-- Profile -->
<div id="profile" class="screen">

    <div class="card">

        <h1>MY PROFILE</h1>

        <div class="profile-box">

            <h2>Tan Falim Safii</h2>

            <p>Technology Enthusiast</p>

        </div>

        <div class="about-box">

            <h2>ABOUT ME</h2>

            <p>

                Halo!

                Saya memiliki minat pada
                Web Development,
                Programming,
                UI/UX Design,
                serta senang membuat
                website bertema Cyberpunk.

            </p>

        </div>

        <button onclick="backDashboard()">

            BACK

        </button>

    </div>

</div>

<script>

const boot = document.getElementById("boot");
const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const profile = document.getElementById("profile");

const loadingBar = document.getElementById("loadingBar");

const dateBox = document.getElementById("dateBox");
const timeBox = document.getElementById("timeBox");

function showScreen(screen){

    boot.style.display = "none";
    login.style.display = "none";
    dashboard.style.display = "none";
    profile.style.display = "none";

    screen.style.display = "flex";

}

function startBoot(){

    showScreen(boot);

    let width = 0;

    loadingBar.style.width = "0%";

    const loading = setInterval(function(){

        width += 2;

        loadingBar.style.width = width + "%";

        if(width >= 100){

            clearInterval(loading);

            showScreen(login);

        }

    },30);

}

function enterSystem(){

    showScreen(dashboard);

}

function openProfile(){

    showScreen(profile);

}

function backDashboard(){

    showScreen(dashboard);

}

function exitSystem(){

    startBoot();

}

function updateClock(){

    const now = new Date();

    dateBox.innerHTML =
    "📅 " +
    now.toLocaleDateString("id-ID",{

        weekday:"long",

        day:"numeric",

        month:"long",

        year:"numeric"

    });

    timeBox.innerHTML =
    "🕒 " +
    now.toLocaleTimeString("id-ID");

}

setInterval(updateClock,1000);

updateClock();

startBoot();

</script>

</body>

</html>
